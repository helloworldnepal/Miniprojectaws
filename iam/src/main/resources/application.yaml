server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://postgresiam:5432/iamdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info